# ============================================
# GitHub Actions 云编译流水线
# 目标：Xiaomi Mi Router WR30U (mediatek/filogic)
# 源码：官方 OpenWrt openwrt-24.10 分支
# 用法：push 到 main 自动编译，或手动 Run workflow
# ============================================
name: Build WR30U OpenWrt 24.10

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget time

      - name: Clone OpenWrt 24.10 source
        run: |
          git clone --depth 1 --branch openwrt-24.10 \
            https://github.com/openwrt/openwrt.git openwrt

      - name: "Pre-build customization (diy-part1: add feeds)"
        run: |
          cd openwrt
          if [ -f ../diy-part1.sh ]; then bash ../diy-part1.sh; fi

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Apply custom config
        run: cp .config openwrt/.config

      - name: "Pre-build customization (diy-part2: bundle files)"
        run: |
          cd openwrt
          if [ -f ../diy-part2.sh ]; then bash ../diy-part2.sh; fi

      - name: Generate full config
        run: |
          cd openwrt
          make defconfig
          # 自检：确认 WR30U ubootmod 设备已进入编译列表（24.10 符号名为 CONFIG_TARGET_DEVICE_xxx）
          if ! grep -q "CONFIG_TARGET_DEVICE_xiaomi_mi-router-wr30u-ubootmod=y" .config; then
            echo "WARN: WR30U device missing after defconfig, injecting..."
            echo "CONFIG_TARGET_DEVICE_xiaomi_mi-router-wr30u-ubootmod=y" >> .config
            make defconfig
          fi
          echo "--- device config check ---"
          grep -E "CONFIG_TARGET_DEVICE_" .config || true
          grep -q "CONFIG_TARGET_DEVICE_xiaomi_mi-router-wr30u-ubootmod=y" .config || { echo "FATAL: WR30U device still not selected"; exit 1; }

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) 2>&1 | tee ../build.log
          if ! ls bin/targets/mediatek/filogic/*squashfs-sysupgrade* >/dev/null 2>&1; then
            echo "===== BUILD FAILED ====="
            grep -iE "error:|ERROR" ../build.log | head -50
            exit 1
          fi

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wr30u-openwrt-24.10-firmware
          path: openwrt/bin/targets/mediatek/filogic/*squashfs-sysupgrade*
          if-no-files-found: error

      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: build-${{ github.run_number }}
          name: "WR30U OpenWrt 24.10 定制固件 #${{ github.run_number }}"
          artifacts: "openwrt/bin/targets/mediatek/filogic/*squashfs-sysupgrade*"
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
